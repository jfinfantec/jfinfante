<style>
:root{color-scheme:dark;--black:#0a0a0a;--white:#f5f5f3;--muted:#bfc0c8;--blue:#172de2}
*{box-sizing:border-box}
html{background:var(--black)}
body{margin:0;min-width:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--black);color:var(--white);font:300 15px/1.75 'Poppins',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.error-page{width:100%;max-width:700px;margin:0 auto;padding:32px 24px;text-align:center}
.error-memoji{display:block;width:clamp(240px,24vw,320px);height:auto;max-width:100%;margin:0 auto 10px}
.error-code{margin:0 0 22px;color:var(--muted);font-size:13px;font-weight:500}
.error-title{margin:0 0 26px;font-family:'widescreen-ex',sans-serif;font-weight:900;font-size:clamp(43px,6.8vw,72px);letter-spacing:-.045em;line-height:1.08}
.error-title .title-line{display:block;white-space:nowrap}
.error-title .title-bubble{display:inline-block;margin-top:.15em;padding:.15em .24em .2em;border-radius:10px;background:var(--blue);color:var(--white);line-height:1.05}
.error-title .uex{font-family:'widescreen-uex','widescreen-ex',sans-serif;font-weight:900}
.error-copy{max-width:440px;margin:0 auto 26px;color:var(--muted);font-size:15px;line-height:1.75}
.error-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.error-actions .button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:14px 22px;border:1px solid #4a4e65;border-radius:14px;background:#17181e;color:var(--white);font:600 14px/1.5 'Poppins',Arial,sans-serif;text-decoration:none}
.error-actions .button--internal{background:var(--blue);border-color:var(--blue)}
.error-actions .button:hover{border-color:#8792c1;background:#232633}
.error-actions .button--internal:hover{background:#263aef}
a:focus-visible{outline:2px solid #94a0ff;outline-offset:5px}
@media(max-width:768px){.error-title{font-size:clamp(30px,10.3vw,58px)}}
@media(max-width:420px){.error-title{font-size:10.3vw}.error-actions{flex-direction:column;align-items:center}.error-actions .button{width:100%;max-width:340px}}
</style>
<style id="jf-componentes-20261020">
/* Componentes equivalentes: misma presentación, sin cambiar su contenido. */
:root{--jf-panel:#14151a;--jf-line:#303138;--jf-control:#17181e;--jf-white:#f5f5f3;--jf-muted:#bfc0c8;--jf-blue:#172de2;--jf-blue-border:#3148ff;--jf-green:#61e317}
body .jf-extended-o{font-family:'widescreen-uex','widescreen-ex',sans-serif;font-weight:900;font-style:normal}

/* Controles de contenido: referencia de Agendar. */
body .site-shell details>summary,
body .site-shell .faq-trigger{
 position:relative;display:block;min-height:56px;width:100%;padding:18px 48px 18px 2px!important;
 color:var(--jf-white)!important;font-family:'Poppins',sans-serif;font-size:15px!important;
 font-weight:500!important;line-height:1.65!important;text-align:left;text-transform:none;
 text-decoration:none!important;cursor:pointer;list-style:none;white-space:normal;overflow-wrap:break-word
}
body .site-shell details>summary::-webkit-details-marker{display:none}
body .site-shell details>summary .detail-indicator,
body .site-shell .faq-trigger>svg{display:none}
body .site-shell details>summary::after,
body .site-shell .faq-trigger::after{
 content:'+';position:absolute;right:2px;top:50%;transform:translateY(-50%);display:grid;place-items:center;
 width:32px;height:32px;box-sizing:border-box;border:1px solid #4a4e65;border-radius:8px;
 background:var(--jf-control);color:var(--jf-white);font:300 23px/1 'Poppins',sans-serif
}
body .site-shell details[open]>summary::after,
body .site-shell .faq-trigger[aria-expanded='true']::after{content:'−';background:var(--jf-blue);border-color:var(--jf-blue)}
body .site-shell details>summary:hover::after,
body .site-shell .faq-trigger:hover::after{border-color:#8792c1}
body .site-shell details>summary:focus-visible,
body .site-shell .faq-trigger:focus-visible{outline:2px solid #94a0ff;outline-offset:4px}
body .site-shell .detail-body,body .site-shell .faq-content{text-align:left}
body .site-shell .jf-disclosure-control{border-bottom:0;margin-top:16px}
body .site-shell .jf-disclosure-control>summary{
 padding:14px 58px 14px 16px!important;border:1px solid var(--jf-line);border-radius:8px;
 background:var(--jf-panel);color:var(--jf-muted)!important
}
body .site-shell .jf-disclosure-control>summary::after{right:12px}
body .site-shell .jf-disclosure-control[open]>summary{color:var(--jf-white)!important}
body .site-shell .jf-disclosure-control>.detail-body{padding-top:18px}

/* Botones de acción. La navegación superior conserva su distribución. */
body .site-shell a.btn,
body main a:is(.btn-primary,.btn-green,.btn-ghost,.action-link,.button){
 display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%;min-height:52px;
 box-sizing:border-box;padding:14px 20px;border-radius:14px;font-family:'Poppins',sans-serif;
 font-size:14px;font-weight:600;line-height:1.5;letter-spacing:0;text-transform:none;
 text-align:center;text-decoration:none;white-space:normal;box-shadow:none;transition:background .16s,border-color .16s
}
body .site-shell a.btn:hover,
body main a:is(.btn-primary,.btn-green,.btn-ghost,.action-link,.button):hover{box-shadow:none;transform:none}
body main a.btn-ghost,
body main a.action-link:not(.action-green){background:var(--jf-control);border:1px solid #4a4e65;color:var(--jf-white)}
body main a.btn-ghost:hover,
body main a.action-link:not(.action-green):hover{background:#232633;border-color:#8792c1}
body .site-shell a.btn-primary,
body main a.btn-primary,
body main a.button--internal,
body .site-shell a.btn-green[href^='#']{background:var(--jf-blue);border:1px solid transparent;color:var(--jf-white)}
body .site-shell a.btn-primary:hover,
body main a.btn-primary:hover,
body main a.button--internal:hover,
body .site-shell a.btn-green[href^='#']:hover{background:#263aef;color:var(--jf-white)}
body .site-shell a.btn:is([href*='api.whatsapp.com'],[href*='wa.me/'],[href*='wa.link/']),
body main a:is(.btn-green,.action-link,.button,.btn-ghost)[href*='wa.link/'],
body main a:is(.btn-green,.action-link,.button,.btn-ghost)[href*='api.whatsapp.com'],
body main a:is(.btn-green,.action-link,.button,.btn-ghost)[href*='wa.me/']{
 background:var(--jf-green);border:1px solid transparent;color:#202020
}
body .site-shell a.btn:is([href*='api.whatsapp.com'],[href*='wa.me/'],[href*='wa.link/']):hover,
body main a:is(.btn-green,.action-link,.button,.btn-ghost)[href*='wa.link/']:hover,
body main a:is(.btn-green,.action-link,.button,.btn-ghost)[href*='api.whatsapp.com']:hover{background:#77ec36;color:#202020}
body .site-shell a.btn-secondary{background:#0a0a0a;border:1px solid var(--jf-blue-border);color:var(--jf-white)}
body .site-shell a.btn-secondary:hover{border-color:#94a0ff;background:#11121c}
body .site-shell a.header-cta{min-height:44px;padding:10px 14px;font-size:12px}

/* Recuadros finales existentes; no se añade un marco a los cierres con memoji. */
body .portfolio-wrap .cta-box,
body .services-ending,
body .contact-cta,
body .site-shell :is(.closing,.production-closing,.meta-closing)>.container{
 background:#0a0a0a;border:1px solid var(--jf-blue-border);border-radius:26px;
 padding:32px 24px;text-align:center
}
body .portfolio-wrap .cta-box h2,
body .services-ending h2,
body .contact-cta h2,
body .site-shell :is(.closing,.production-closing,.meta-closing) h2{
 font-family:'widescreen-ex',sans-serif;font-size:clamp(24px,6.15vw,32px);font-weight:900;
 font-style:normal;line-height:1.13;letter-spacing:-.045em;text-align:center;margin:0 0 18px;
 text-transform:uppercase;overflow-wrap:normal
}
body .portfolio-wrap .cta-box p,
body .services-ending p,
body .contact-cta p,
body .site-shell :is(.closing,.production-closing,.meta-closing) .closing-copy,
body .site-shell .meta-closing-copy>p{color:var(--jf-muted);font-size:15px;font-weight:300;line-height:1.75;text-align:center}
body .contact-cta .button{margin-top:8px}

/* El centro del logo es independiente de la longitud de los textos laterales. */
@media(min-width:769px){
 body>footer{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px}
 body>footer>:first-child{justify-self:start;text-align:left}
 body>footer>img{justify-self:center}
 body>footer>:last-child{justify-self:end;text-align:right}
}
@media(max-width:480px){
 body .portfolio-wrap .cta-box,body .services-ending,body .contact-cta,
 body .site-shell :is(.closing,.production-closing,.meta-closing)>.container{padding:28px 20px}
}
@media(prefers-reduced-motion:reduce){
 body .site-shell a.btn,body main a:is(.btn-primary,.btn-green,.btn-ghost,.action-link,.button){transition:none}
}

</style>
